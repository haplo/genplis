[project]
name = "genplis"
version = "1.0.0"
description = "Generate M3U music playlists from tags and user-defined filters"
authors = [
    { name = "Fidel Ramos", email = "contact.gyldd@8shield.net" }
]
dependencies = [
    "psutil>=6.0.0",
    "tinytag>=2.3.2,<2.4",
    "xdg-base-dirs>=6.0.2",
]
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["music", "playlists", "m3u", "m3ug", "tags", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://haplo.github.io/genplis/"
Documentation = "https://haplo.github.io/genplis/docs/"
Repository = "https://github.com/haplo/genplis"
Issues = "https://github.com/haplo/genplis/issues"
Changelog = "https://github.com/haplo/genplis/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
genplis = "genplis.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genplis"]

[tool.hatch.build.targets.sdist]
exclude = ["/.opencode", "/.dir-locals.el", "/.envrc"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["genplis"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
isort.known-first-party = ["genplis"]
# only until tinytag is removed from src
isort.known-third-party = ["tinytag"]
select = ["ANN", "ASYNC", "E4", "E7", "E9", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.uv]
upgrade-package = ["ty", "ruff"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "pytest-cov>=7.1.0",
    "python-lsp-ruff>=2.2.2",
    "python-lsp-server>=1.12.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
docs = [
    "zensical>=0.0.70",
]
