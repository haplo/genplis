[project]
name = "genplis"
version = "0.1.0"
description = "Generate music playlists based off ID3 tags"
authors = [
    { name = "Fidel Ramos", email = "contact.gyldd@8shield.net" }
]
dependencies = [
    "psutil>=6.0.0",
    "tinytag>=2.0.0",
    "xdg-base-dirs>=6.0.2",
]
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
genplis = "genplis.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genplis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "src/tinytag/**",
]

[tool.ruff.lint]
isort.known-first-party = ["genplis"]
# only until tinytag is removed from src
isort.known-third-party = ["tinytag"]
select = ["ANN", "ASYNC", "E4", "E7", "E9", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.uv]
upgrade-package = ["ty", "ruff"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "python-lsp-ruff>=2.2.2",
    "python-lsp-server>=1.12.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
