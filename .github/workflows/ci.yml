name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep this in sync with the exclude-newer window used to generate uv.lock.
  UV_EXCLUDE_NEWER: "7 days"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pre-commit on all files
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked python -m pytest \
            --cov=genplis \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=markdown:coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run --locked python -m pytest
