[project]
site_name = "Genplis"
site_url = "https://haplo.github.io/genplis/"
site_description = "Your music. Your rules. Your playlists. Generate M3U playlists from the tags in your local music collection."
site_author = "Fidel Ramos"
repo_url = "https://github.com/haplo/genplis"
repo_name = "haplo/genplis"
edit_uri = ""
copyright = "Fidel Ramos · Open source under GPL-3.0-or-later"
docs_dir = ".website-src"
site_dir = "site"
extra_css = ["assets/stylesheets/website.css"]
nav = [
  { "Home" = "index.md" },
  { "Documentation" = [
    { "Overview" = "docs/index.md" },
    { "Usage" = "docs/usage.md" },
    { "M3UG reference" = "docs/m3ug.md" },
    { "M3UG Examples" = "docs/examples.md" },
    { "Configuration" = "docs/config.md" },
    { "Tags" = "docs/tags.md" },
    { "AI agents" = "docs/agents.md" },
    { "Agent instructions" = "docs/agent-instructions.md" },
    { "Scheduling" = "docs/scheduling.md" },
    { "Development" = "docs/dev.md" },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "website/overrides"
language = "en"
font = false
logo = "assets/branding/logo.svg"
favicon = "assets/branding/favicon.svg"
features = [
  "content.code.copy",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.plugins.search]
enabled = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences = {}
pymdownx.details = {}
pymdownx.tasklist.custom_checkbox = true
