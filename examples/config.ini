# Genplis configuration file.
#
# Default location: $XDG_CONFIG_HOME/genplis/config.ini
#              or: ~/.config/genplis/config.ini
#
# All settings are optional. Command-line options override these values.

[general]
# Same as --verbose.
verbose = false

# Same as --quiet. Do not enable together with verbose.
quiet = false

[collection]
# Used when PATH is omitted on the command line.
path = ~/Music

# Regular expressions matched against file and folder paths, one per line.
# Files and folders matching any pattern are skipped. The contents of an
# excluded folder are not scanned. Passing --exclude on the command line
# replaces this list.
exclude =
    /\.Trash/
    /@eaDir/
    \.tmp$

[tags]
# Discard tag values whose combined UTF-8 encoded length exceeds this many
# bytes. Values exactly at the limit are kept. Set to 0 to disable the
# limit. Calculated values such as filename and filesize are never discarded
# by this limit. This is the same threshold genplis uses by default.
max_size = 1000

# Tag names to discard before caching and filtering, one per line.
# Calculated values such as *filename, *filesize or *rating are also
# controlled by this list (without the *).
ignore =
    comment
    encoder
    encoder_settings
    lyrics

[database]
# Optional cache location. Defaults to
# $XDG_CACHE_HOME/genplis/genplis.db
# path = ~/.cache/genplis/genplis.db

[output]
# Overwrite generated .m3u files that already exist.
overwrite = true

# Embed the original M3UG source as comments in generated playlists.
include_source = true
